<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK — PDF Reader + Auto Voice + Typing Scroll</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

    :root {
      --color-background: #111;
      --color-surface: #333;
      --color-icon-default: #b3b3b3;
      --color-accent: #1db954;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-background);
      color: #eee;
      overflow: hidden; /* Hide page scroll */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 80px;
      background: #000;
      border-bottom: 2px solid #222;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
    }

    .upload-btn {
      background: #222;
      color: #fff;
      font-weight: 600;
      padding: 10px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-btn:hover { background: #444; }

    input[type="file"] { display: none; }

    .container {
      display: flex;
      gap: 30px;
      padding: 40px 80px;
      align-items: stretch;
    }

    .left-card, .right-card {
      padding: 30px;
      position: relative;
      height: 435px;
    }

    .left-card {
      flex: 0 0 20%;
      background: black;
      box-shadow: -8px -8px 1px #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    #pdfText {
      font-family: monospace;
      font-size: 14px;
      line-height: 1.4;
      color: #00ff88;
      white-space: pre-wrap;
      overflow-y: auto; /* Enable scroll */
      flex: 1;
      padding-right: 5px;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    #pdfText::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    #pdfText {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;     /* Firefox */
    }

    .right-card {
      flex: 0 0 80%;
      background: black;
      box-shadow: -8px -8px 1px #1a1a1a;
      position: relative;
    }

    .right-card video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    .right-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    h2 { font-weight: 700; color: #fff; z-index: 2; position: relative; margin-bottom: 15px; }

    @media(max-width: 900px) {
      .container { flex-direction: column; padding: 20px; }
      .left-card, .right-card { flex: 1; width: 100%; height: auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">BööK</div>
  <label for="pdfUpload" class="upload-btn">📄 Upload PDF</label>
  <input type="file" id="pdfUpload" accept="application/pdf">
</header>

<div class="container">
  <!-- Left -->
  <div class="left-card">
    <h2>PDF Text</h2>
    <p id="pdfText">Upload a PDF to start reading...</p>
  </div>

  <!-- Right -->
  <div class="right-card">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="https://cdn.dribbble.com/userupload/16958329/file/original-b325a2d43c22aa85b8236222bc6b02ec.mp4" type="video/mp4">
    </video>
    <h2>Background Video</h2>
    <p>PDF text will be shown on the left with typing + auto voice.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
  const pdfInput = document.getElementById('pdfUpload');
  const pdfText = document.getElementById('pdfText');
  const video = document.getElementById('bgVideo');
  let currentUtterance = null;
  let currentVolume = 1;
  let googleVoice = null;

  // Load Voices (Google English + Hindi only)
  function loadVoices() {
    const voices = speechSynthesis.getVoices();
    googleVoice = voices.find(v =>
      v.name.toLowerCase().includes("google") &&
      (v.lang === "en-US" || v.lang === "hi-IN")
    ) || voices[0];
  }
  window.speechSynthesis.onvoiceschanged = loadVoices;

  // Typing + Voice (Auto Play)
  async function typeTextWithVoice(text, element, delay = 20) {
    element.textContent = "";
    let index = 0;
    speechSynthesis.cancel();
    currentUtterance = new SpeechSynthesisUtterance(text);
    currentUtterance.lang = text.match(/[अ-ह]/) ? "hi-IN" : "en-US";
    currentUtterance.volume = currentVolume;
    currentUtterance.rate = 1;
    currentUtterance.pitch = 1;
    if (googleVoice) currentUtterance.voice = googleVoice;

    currentUtterance.onend = () => {
      video.pause(); // Pause video after reading completes
    };

    speechSynthesis.speak(currentUtterance);

    while (index < text.length) {
      element.textContent += text[index];
      element.scrollTop = element.scrollHeight;
      index++;
      await new Promise(res => setTimeout(res, delay));
    }
  }

  // PDF Upload + Auto Read
  pdfInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    video.style.display = 'block';
    video.play();
    pdfText.textContent = "Extracting text...";

    const reader = new FileReader();
    reader.onload = async function() {
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;
      let textContent = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const text = await page.getTextContent();
        textContent += text.items.map(item => item.str).join(' ') + '\n';
      }

      const readableText = textContent.slice(0, 4000) || "No readable text found.";
      await typeTextWithVoice(readableText, pdfText, 20);
    };
    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
